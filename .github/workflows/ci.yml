name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Check HTML
        run: |
          echo "Checking HTML files..."
          test -f index.html

      - name: Check JavaScript
        run: |
          echo "Checking JavaScript files..."
          node --check script.js